<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edge</title><meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Edge">
<link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#0a0e14;--panel:#121a28;--bg2:#1a2436;--line:#243044;--ink:#eef2f8;--dim:#8a97ab;--green:#3ddc84;--red:#ff5d5d;--amber:#f5b942}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Inter,system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px}
h1{font-size:26px;margin:0;font-weight:900;letter-spacing:-.01em}.upd{font-size:12px;color:var(--dim)}
.pos{color:var(--green)}.neg{color:var(--red)}.dim{color:var(--dim)}
.day{font-size:13px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:18px 2px 8px}
.g{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.g.play{border-color:var(--green)}.g.lean{border-color:#3a3320}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.tm{flex:1;min-width:0}.tm .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tm .n img{width:20px;height:20px;vertical-align:-5px;margin-right:4px}
.tm .t{font-size:12px;color:var(--dim);margin-top:2px}
.v{text-align:right;flex:none}
.v .call{font-weight:900;font-size:17px}.v .conf{font-size:12px;font-weight:800}
.badge{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:6px;margin-bottom:3px}
.badge.play{background:var(--green);color:#062312}.badge.lean{background:#3a3320;color:var(--amber)}.badge.none{color:var(--dim);border:1px solid var(--line)}
.badge.win{background:var(--green);color:#062312}.badge.loss{background:var(--red);color:#2a0606}.badge.live{background:var(--amber);color:#2a1c00}
.an{display:none;padding:0 14px 14px;font-size:14px;color:#c9d2e0;border-top:1px solid var(--line)}
.g.open .an{display:block}
.an h4{margin:12px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.an table{width:100%;border-collapse:collapse;font-size:13px}.an td{padding:4px 0;border-bottom:1px dashed var(--line)}.an td:last-child{text-align:right;font-weight:700}
.filters{display:flex;gap:6px}.filters button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font:700 13px inherit;padding:9px 4px;border-radius:10px}.filters button.on{color:var(--ink);border-color:var(--ink)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--dim);text-align:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.k .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}.k .big{font:900 30px/1.1 ui-monospace,SFMono-Regular,monospace;margin:4px 0}.k .s{font-size:12px;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.hr{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}.hr .r{font-weight:800;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,20,31,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;background:none;border:0;color:var(--dim);font:800 15px inherit;padding:10px;border-radius:12px}nav button.on{color:var(--ink);background:var(--bg2)}
.foot{font-size:12px;color:var(--dim);text-align:center;margin:20px 0}.foot a{color:var(--dim)}
[hidden]{display:none!important}
</style></head><body>
<header><h1 id="ttl">Today</h1><div class="upd" id="upd">loading…</div></header>

<section id="vBoard">
  <div class="filters"><button data-f="all" class="on">All</button><button data-f="nfl">NFL</button><button data-f="cfb">College</button><button data-f="plays">Plays only</button></div>
  <div id="games"></div>
</section>

<section id="vHist" hidden>
  <div class="kpis">
    <div class="k"><div class="l">College plays</div><div class="big" id="hC">—</div><div class="s" id="hCs"></div></div>
    <div class="k"><div class="l">NFL plays</div><div class="big" id="hN">—</div><div class="s" id="hNs"></div></div>
  </div>
  <div class="card"><div class="dim" style="font-size:12px;margin-bottom:6px">Profit if every PLAY was $10</div><div id="chart"></div></div>
  <div class="day">Recent plays</div>
  <div id="recent"></div>
  <div class="day">By signal</div>
  <div class="card" id="bysig" style="padding:4px 12px"></div>
  <div class="foot">$10 a play at -110 · graded by the server every 10 min · <a href="/board">full analysis board</a></div>
</section>

<nav><button data-v="board" class="on">Today</button><button data-v="hist">History</button></nav>

<script>
const $=id=>document.getElementById(id);
const money=x=>(x<0?"−":"+")+"$"+Math.abs(x).toFixed(0);
const tm=d=>new Date(d).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const dayOf=d=>new Date(d).toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"});
let UP=null, FILTER="all";

/* ---- the one rule set: what's a PLAY, what's a LEAN, and how confident ---- */
function verdict(g){
  if(g.noLine) return {tier:"none",why:["No line posted yet."]};
  const m=g.model, f=g.flags, why=[]; let pick=null;
  if(g.lg==="cfb"){
    if(f.dogimp10&&!(m.dir==="UNDER"&&m.conf>=55)){ pick={dir:"OVER",tier:"play",conf:Math.max(60,m.dir==="OVER"?m.conf:0)}; why.push(`Big mismatch: the underdog is expected to score only ~${g.dogImp}. Backups and garbage-time scores push these over — this signal is 41–20 this season.`); }
    if(m.conf>=58&&(!pick||pick.dir===m.dir)){ pick={dir:m.dir,tier:"play",conf:Math.max(pick?pick.conf:0,Math.min(65,m.conf))}; why.push(`The totals model is ${m.conf}% on the ${m.dir} — its strongest tier, which hit ~60% on seasons it had never seen.`); }
    else if(!pick&&m.conf>=55){ pick={dir:m.dir,tier:"play",conf:m.conf}; why.push(`The totals model is ${m.conf}% on the ${m.dir}. This 55–58% tier has gone 36–24 (60%) in college this season.`); }
    else if(!pick&&m.conf>=52&&f.lowlast&&m.dir==="OVER"){ pick={dir:"OVER",tier:"lean",conf:55}; why.push(`A team is coming off a ≤30-point game (college overs after that: 15–9 this season) and the model tilts over at ${m.conf}%.`); }
    if(pick&&pick.dir==="OVER"&&f.lowlast&&pick.tier==="play") why.push("One of these teams just played a ≤30-point game — totals over-correct after those (15–9 this season).");
    if(pick&&f.rankclash&&pick.dir==="UNDER") why.push("Ranked vs ranked — these have leaned under the last three seasons.");
  } else {
    if(f.bothunder&&m.dir==="OVER"&&m.conf>=55){ pick={dir:"OVER",tier:"play",conf:Math.min(62,Math.max(58,m.conf))}; why.push(`Both teams' last game went under the total — NFL totals over-correct after that (over hit 55 / 59 / 63% the last three seasons) — and the model agrees at ${m.conf}%.`); }
    else if((f.windy||f.wet)&&!g.indoor){ pick={dir:"UNDER",tier:"lean",conf:57}; why.push(`Weather: ${g.weather.gust} mph gusts, ${g.weather.precip}% rain. NFL weather unders are 7–1 this season, but historically swingy (71 / 43 / 61% by year) and the market has usually moved the total already.`); }
    else if(m.conf>=58){ pick={dir:m.dir,tier:"lean",conf:Math.min(58,m.conf)}; why.push(`The totals model leans ${m.dir} at ${m.conf}%. The NFL model alone is lean-strength only.`); }
  }
  if(pick&&pick.dir==="OVER"&&f.windy){ why.push(`Skipped: ${g.weather.gust} mph gusts argue against an over.`); pick=null; }
  // SIDE: unranked team laying 21+ to an FCS school — the favorite covers (52–32 this season)
  let side=null;
  if(f.unrfavfcs){ side={team:g.fav,line:-Math.abs(g.spread),tier:"play",conf:60}; why.push(`<b>Side:</b> ${g.fav} is unranked and laying ${Math.abs(g.spread)} to an FCS school. Unranked favorites keep their foot down in these games — the favorite has covered 52–32 (62%) this season.`); }
  if(!pick&&!side) return {tier:"none",why:why.length?why:["Nothing measured says this line is off — the book's number looks fair."]};
  if(!pick) return {tier:side.tier,conf:side.conf,dir:null,side,why};
  return {...pick,side,why};
}
function sideResult(g,s){ if(!s||g.state==="pre") return null; if(g.state==="in") return "live"; const cm=(g.hs-g.as)+g.spread; if(cm===0) return "push"; return ((cm>0)===(s.team===g.home))?"win":"loss"; }
function result(g,v){
  if(!v.dir||g.total==null) return null; const t=g.hs+g.as;
  if(g.state==="post") return t===g.total?"push":((t>g.total)===(v.dir==="OVER")?"win":"loss");
  if(g.state==="in") return "live"; return null;
}
function gameCard(g){
  const v=verdict(g), r=result(g,v), price=v.dir==="OVER"?g.overOdds:v.dir==="UNDER"?g.underOdds:null;
  const score=g.state!=="pre"?`${g.away} ${g.as}–${g.hs} ${g.home} · ${g.state==="post"?"Final":"Live"}`:`${tm(g.date)}${g.lg==="nfl"?" · NFL":""}`;
  const right=v.tier==="none"?`<span class="badge none">NO PLAY</span>`:
    [v.dir?{lab:`${v.dir} ${g.total}`,r,tier:v.tier,conf:v.conf}:null, v.side?{lab:`${v.side.team} ${v.side.line}`,r:sideResult(g,v.side),tier:v.side.tier,conf:v.side.conf}:null].filter(Boolean).map(x=>
    `<div style="margin-bottom:4px"><span class="badge ${x.r==="win"?"win":x.r==="loss"?"loss":x.r==="live"?"live":x.tier}">${x.r==="win"?"WON":x.r==="loss"?"LOST":x.r==="live"?"LIVE":x.tier==="play"?"PLAY":"LEAN"}</span><div class="call">${x.lab}</div><div class="conf ${x.tier==="play"?"pos":"dim"}">${Math.round(x.conf)}% confident</div></div>`).join("");
  const f=g.form||{home:{},away:{}}, w=g.weather;
  const moved=g.openTotal!=null&&g.openTotal!==g.total;
  return `<div class="g ${v.tier}" data-id="${g.id}"><div class="row">
      <div class="tm"><div class="n"><img src="${g.awayLogo||""}" alt="">${g.away} @ <img src="${g.homeLogo||""}" alt="">${g.home}</div><div class="t">${score}</div></div>
      <div class="v">${right}</div></div>
    <div class="an">
      <h4>Why</h4><div>${v.why.join("<br><br>")}</div>
      ${g.noLine?"":`<h4>The numbers</h4><table>
        <tr><td>Total</td><td>${g.total}${moved?` <span class="dim">(opened ${g.openTotal})</span>`:""}</td></tr>
        <tr><td>Spread</td><td>${g.spread>0?g.away:g.home} ${-Math.abs(g.spread)}</td></tr>
        ${price!=null&&v.dir?`<tr><td>Price on the ${v.dir.toLowerCase()}</td><td>${price>0?"+":""}${price}</td></tr>`:""}
        <tr><td>Model</td><td>${g.model.conf}% ${g.model.dir}</td></tr>
        <tr><td>${g.away} scoring (for / against)</td><td>${f.away.ppg??"—"} / ${f.away.pa??"—"}</td></tr>
        <tr><td>${g.home} scoring (for / against)</td><td>${f.home.ppg??"—"} / ${f.home.pa??"—"}</td></tr>
        <tr><td>Last game vs its total</td><td>${g.away} ${f.away.lastOU==="O"?"over":f.away.lastOU==="U"?"under":"—"} · ${g.home} ${f.home.lastOU==="O"?"over":f.home.lastOU==="U"?"under":"—"}</td></tr>
        <tr><td>Weather</td><td>${g.indoor?"Dome":w?`${w.temp??"—"}° · ${w.gust??0} mph gusts · ${w.precip??0}% rain`:"—"}</td></tr>
      </table>`}
    </div></div>`;
}
function renderBoard(){
  if(!UP){ return; }
  let gs=UP.games.slice();
  if(FILTER==="nfl"||FILTER==="cfb") gs=gs.filter(g=>g.lg===FILTER);
  if(FILTER==="plays") gs=gs.filter(g=>verdict(g).tier==="play");
  // plays first within each day, then leans, then the rest by kickoff
  const rank=g=>({play:0,lean:1,none:2})[verdict(g).tier];
  const days={}; gs.forEach(g=>{ (days[dayOf(g.date)]=days[dayOf(g.date)]||[]).push(g); });
  const html=Object.entries(days).map(([d,list])=>{ list.sort((a,b)=>rank(a)-rank(b)||new Date(a.date)-new Date(b.date));
    const n=list.filter(g=>verdict(g).tier==="play").length;
    return `<div class="day">${d}${n?` · <span class="pos">${n} play${n>1?"s":""}</span>`:""}</div>`+list.map(gameCard).join(""); }).join("");
  $("games").innerHTML=html||`<div class="empty">No games in the next 7 days match.</div>`;
  $("upd").textContent="updated "+new Date(UP.generatedAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
$("games").addEventListener("click",e=>{ const c=e.target.closest(".g"); if(c&&e.target.closest(".row")) c.classList.toggle("open"); });
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{ FILTER=b.dataset.f; document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("on",x===b)); renderBoard(); });

/* ---- history ---- */
async function loadHistory(){
  const d=await (await fetch("/api/record",{cache:"no-store"})).json();
  const g=(d.records||[]).filter(r=>r.graded&&!r.live);
  const dirs={}; g.forEach(r=>{ (dirs[r.gameId]=dirs[r.gameId]||new Set()).add(r.dir); });
  const contested=r=>dirs[r.gameId].has("OVER")&&dirs[r.gameId].has("UNDER");
  const W=r=>r.result==="win", L=r=>r.result==="loss", P=rs=>rs.reduce((a,r)=>a+(W(r)?100/11:L(r)?-10:0),0), rec=rs=>`${rs.filter(W).length}–${rs.filter(L).length}`;
  const cfb=g.filter(r=>r.lg==="cfb"&&!contested(r)&&r.cats.some(c=>c==="mtotal"||c==="dogimp10"||c==="unrfavfcs"));
  const nfl=g.filter(r=>r.lg==="nfl"&&!r.cats.includes("qbout")&&r.cats.some(c=>["bothunder","wind","precip","mtotal"].includes(c)));
  const set=(id,rs)=>{ const v=P(rs); $(id).textContent=money(v); $(id).className="big "+(v>=0?"pos":"neg"); $(id+"s").textContent=`${rec(rs)} · ${rs.length} plays`; };
  set("hC",cfb); set("hN",nfl);
  // chart
  const ser=rs=>{ let s=0; return rs.slice().sort((a,b)=>a.kickoff-b.kickoff).map(r=>({t:r.kickoff,v:s+=W(r)?100/11:L(r)?-10:0})); };
  const A=ser(cfb),B=ser(nfl),all=[...A,...B];
  if(all.length){ const t0=Math.min(...all.map(p=>p.t)),t1=Math.max(...all.map(p=>p.t)),lo=Math.min(0,...all.map(p=>p.v)),hi=Math.max(10,...all.map(p=>p.v)),Wd=640,H=180,Pd=18;
    const x=t=>Pd+(Wd-2*Pd)*(t-t0)/Math.max(1,t1-t0), y=v=>H-Pd-(H-2*Pd)*(v-lo)/(hi-lo);
    const path=S=>S.length?"M"+[[S[0].t,0],...S.map(p=>[p.t,p.v])].map(([t,v])=>`${x(t).toFixed(1)},${y(v).toFixed(1)}`).join("L"):"";
    $("chart").innerHTML=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;height:auto"><line x1="${Pd}" x2="${Wd-Pd}" y1="${y(0)}" y2="${y(0)}" stroke="#243044" stroke-dasharray="4 4"/><path d="${path(A)}" fill="none" stroke="#3ddc84" stroke-width="3"/><path d="${path(B)}" fill="none" stroke="#6aa8ff" stroke-width="2.5"/><text x="${Wd-Pd}" y="14" fill="#3ddc84" font-size="13" font-weight="800" text-anchor="end">College</text><text x="${Wd-Pd}" y="30" fill="#6aa8ff" font-size="13" font-weight="800" text-anchor="end">NFL</text></svg>`; }
  // recent
  $("recent").innerHTML=[...cfb,...nfl].sort((a,b)=>b.kickoff-a.kickoff).slice(0,25).map(r=>`<div class="hr"><div><div style="font-weight:700">${r.playText.replace(/^Lean\s+/i,"").split(" — ")[0]}</div><div class="dim" style="font-size:12px">${r.name} · ${r.awayAb} ${r.finalAway}–${r.finalHome} ${r.homeAb} · ${new Date(r.kickoff).toLocaleDateString([], {month:"short",day:"numeric"})}</div></div><div class="r ${W(r)?"pos":L(r)?"neg":"dim"}">${W(r)?"+$9":L(r)?"−$10":"push"}</div></div>`).join("")||'<div class="empty">No graded plays yet.</div>';
  // by signal
  const sig=[["College · model / mismatch-over (the plays)",cfb],["NFL · both-under + weather (the plays)",nfl],["NFL · 'QB ruled out' (retired)",g.filter(r=>r.lg==="nfl"&&r.cats.includes("qbout"))],["College · 60+ total under (retired)",g.filter(r=>r.lg==="cfb"&&!contested(r)&&r.cats.includes("hightotal")&&!r.cats.some(c=>c==="mtotal"||c==="dogimp10"))]];
  $("bysig").innerHTML=sig.map(([l,rs])=>{ const v=P(rs); return `<div class="hr"><div>${l}<div class="dim" style="font-size:12px">${rec(rs)}</div></div><div class="r ${v>=0?"pos":"neg"}">${money(v)}</div></div>`; }).join("");
}

/* ---- nav + data ---- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b)); const h=b.dataset.v==="hist"; $("vBoard").hidden=h; $("vHist").hidden=!h; $("ttl").textContent=h?"History":"Today"; window.scrollTo(0,0); if(h) loadHistory(); });
async function loadUp(){ try{ UP=await (await fetch("/api/upcoming",{cache:"no-store"})).json(); renderBoard(); }catch(e){ $("upd").textContent="offline — retrying"; } }
loadUp(); setInterval(loadUp,3*60e3);
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
